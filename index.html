<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
    </head>

    <body>
        <div>
        <center><h1>Calculator</h1></center>
        <center><h3><i>Simple & Clean</i></h3></center>
        </div>

        <div class="calculator">
            <input type="text" id="display" readonly>
        </div>

        <div class="button">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>

            <button>0</button>
            <button>C</button>
            <button>=</button>
            <button>+</button>

        </div>
        <script src="script.js"></script>
    </body>
</html>
